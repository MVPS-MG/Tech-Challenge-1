name: Python Lint

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black==24.10.0 flake8==7.1.1 nbqa==1.9.1

      - name: Run black
        run: black --check .

      - name: Run flake8
        run: flake8 .

      - name: Run nbqa-black on notebooks
        run: nbqa black --check notebooks

      - name: Run nbqa-flake8 on notebooks
        run: nbqa flake8 notebooks
